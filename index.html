<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Pacifico&family=Dancing+Script:wght@700&family=Lobster&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Playfair+Display:wght@700&family=Satisfy&family=Great+Vibes&family=Audiowide&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;

/* Variables that will be updated by JS */
--theme-color: #d946ef;
--theme-color-secondary: #8b5cf6;

background:linear-gradient(-45deg,
#0b0416,
#17062e,
var(--theme-color-secondary),
#0f172a);

background-size:400% 400%;
animation:gradientMove 15s ease infinite;

font-family: 'Poppins', sans-serif;

}

@keyframes gradientMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

/* Background glow */

body::before{

content:"";
position:absolute;
width:700px;
height:700px;
background: var(--theme-color-secondary);
filter:blur(180px);
border-radius:50%;
opacity:.35;
animation:moveGlow 10s ease-in-out infinite alternate;

}

body::after{

content:"";
position:absolute;
width:500px;
height:500px;
background: var(--theme-color);
filter:blur(150px);
border-radius:50%;
opacity:.3;
animation:moveGlow2 12s ease-in-out infinite alternate;

}

@keyframes moveGlow{

from{
transform:translate(-250px,-120px);
}

to{
transform:translate(220px,160px);
}

}

@keyframes moveGlow2{

from{
transform:translate(250px,120px);
}

to{
transform:translate(-220px,-180px);
}

}

/* Professional Input Modal */
#setup-modal {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(15, 23, 42, 0.75);
backdrop-filter: blur(15px);
-webkit-backdrop-filter: blur(15px);
z-index: 100;
display: flex;
justify-content: center;
align-items: center;
transition: opacity 0.6s ease, visibility 0.6s ease;
}

#setup-modal.hidden {
opacity: 0;
visibility: hidden;
pointer-events: none;
}

.modal-card {
background: rgba(30, 41, 59, 0.7);
border: 1px solid rgba(255, 255, 255, 0.1);
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
border-radius: 20px;
padding: 40px;
width: 90%;
max-width: 420px;
text-align: left;
color: white;
}

.modal-card h2 {
font-size: 28px;
font-weight: 700;
margin-bottom: 6px;
background: linear-gradient(45deg, #38bdf8, #d946ef);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

.modal-card p {
font-size: 14px;
color: #94a3b8;
margin-bottom: 24px;
}

.input-group {
margin-bottom: 20px;
}

.input-group label {
display: block;
font-size: 11px;
font-weight: 700;
text-transform: uppercase;
letter-spacing: 1.5px;
margin-bottom: 8px;
color: #cbd5e1;
}

.input-group input {
width: 100%;
padding: 14px 16px;
background: rgba(15, 23, 42, 0.5);
border: 1px solid rgba(255, 255, 255, 0.15);
border-radius: 10px;
color: white;
font-family: inherit;
font-size: 15px;
transition: all 0.3s ease;
}

.input-group input:focus {
outline: none;
border-color: #38bdf8;
box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
}

#btn-submit {
width: 100%;
padding: 14px;
background: linear-gradient(135deg, #4f46e5, #9d4edd);
border: none;
border-radius: 10px;
color: white;
font-weight: 700;
font-size: 16px;
cursor: pointer;
transition: all 0.3s ease;
margin-top: 10px;
}

#btn-submit:hover {
transform: translateY(-2px);
box-shadow: 0 10px 20px rgba(157, 78, 221, 0.4);
}

.container{

position:relative;
z-index:10;
text-align:center;

}

#name{

font-size:95px;
font-weight:bold;
color:white;
letter-spacing:5px;

text-shadow:

0 0 15px #fff,
0 0 30px var(--theme-color),
0 0 60px var(--theme-color-secondary),
0 0 90px #38bdf8;

animation:pulse 2s infinite;

}

@keyframes pulse{

50%{
transform:scale(1.06);
text-shadow:

0 0 20px white,
0 0 40px var(--theme-color),
0 0 80px cyan,
0 0 120px var(--theme-color-secondary);

}

}

.cursor{

display:inline-block;
width:5px;
height:90px;
background:white;
margin-left:5px;

animation:blink .7s infinite;

}

@keyframes blink{

50%{
opacity:0;
}

}

/* Particles */

.particle{

position:absolute;
border-radius:50%;
pointer-events:none;
animation:float linear infinite;

}

@keyframes float{

from{

transform:translateY(100vh) scale(.4);

}

to{

transform:translateY(-120vh) scale(1.2);

}

}

</style>
</head>
<body>

<!-- Modern Setup Screen -->
<div id="setup-modal">
  <div class="modal-card">
    <h2>Welcome</h2>
    <p>Customize your animated identity theme</p>
    
    <div class="input-group">
      <label for="user-name">Your Name</label>
      <input type="text" id="user-name" placeholder="Enter your name" autocomplete="off" required>
    </div>
    
    <div class="input-group">
      <label for="user-color">Favorite Color Name</label>
      <input type="text" id="user-color" placeholder="e.g. Crimson, Teal, Violet, Coral" autocomplete="off" required>
    </div>
    
    <button id="btn-submit">Launch Experience</button>
  </div>
</div>

<div class="container">

<div id="name"></div>

</div>

<script>

// Helper: Converts underscores/hyphens to spaces, and capitalizes the first letter of each word
function cleanAndFormatName(rawName) {
  if (!rawName) return "Guest";
  
  // Replace underscores and hyphens with spaces
  let cleaned = rawName.replace(/[_-]+/g, ' ');
  
  // Capitalize first letter of every word (Title Case)
  return cleaned
    .split(' ')
    .filter(word => word.length > 0)
    .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
    .join(' ');
}

// Helper: Safely converts any valid CSS color name (or format) into a real hex color code
function nameToHex(colorName) {
  if (!colorName) return "#d946ef"; // fallback default
  
  // Create a temporary element to let the browser compute the style
  const temp = document.createElement("div");
  temp.style.color = colorName;
  document.body.appendChild(temp);
  
  const resolved = window.getComputedStyle(temp).color;
  document.body.removeChild(temp);
  
  // Parse rgb(r, g, b) or rgba(r, g, b, a) values returned by the browser
  const match = resolved.match(/\d+/g);
  if (!match || match.length < 3) return "#d946ef"; 
  
  const r = parseInt(match[0]).toString(16).padStart(2, '0');
  const g = parseInt(match[1]).toString(16).padStart(2, '0');
  const b = parseInt(match[2]).toString(16).padStart(2, '0');
  
  return `#${r}${g}${b}`;
}

const fonts=[

"'Poppins'",
"'Pacifico'",
"'Dancing Script'",
"'Lobster'",
"'Orbitron'",
"'Cinzel'",
"'Playfair Display'",
"'Satisfy'",
"'Great Vibes'",
"'Audiowide'"

];

const nameElement = document.getElementById("name");
let fontIndex=0;
let text = ""; 

function typeAnimation(){

nameElement.innerHTML="";

nameElement.style.fontFamily=fonts[fontIndex];

let i=0;

let typing=setInterval(()=>{

if(i<text.length){

nameElement.innerHTML=text.substring(0,i+1)+
"<span class='cursor'></span>";

i++;

}

else{

clearInterval(typing);

setTimeout(eraseAnimation,1800);

}

},180);

}

function eraseAnimation(){

let i=text.length;

let erase=setInterval(()=>{

if(i>=0){

nameElement.innerHTML=text.substring(0,i)+
"<span class='cursor'></span>";

i--;

}

else{

clearInterval(erase);

fontIndex++;

if(fontIndex>=fonts.length)
fontIndex=0;

setTimeout(typeAnimation,500);

}

},120);

}

// Handle Form Submission
document.getElementById('btn-submit').addEventListener('click', () => {
  const nameInput = document.getElementById('user-name').value.trim();
  const colorInput = document.getElementById('user-color').value.trim();
  
  // Process the name to remove underscores and capitalize the first letters
  text = cleanAndFormatName(nameInput);
  document.title = text;
  
  // Convert standard color names into precise hex codes
  const baseColorHex = nameToHex(colorInput);
  
  // Create a secondary darker/semi-transparent accent color from the hex code
  const secondaryColorHex = baseColorHex + "99"; 

  // Apply properties to CSS variables
  document.body.style.setProperty('--theme-color', baseColorHex);
  document.body.style.setProperty('--theme-color-secondary', secondaryColorHex);
  
  // Hide the modal with CSS transitions
  document.getElementById('setup-modal').classList.add('hidden');
  
  // Start the animation loops
  typeAnimation();
  generateParticles(baseColorHex);
});

// Generate Particles inside a modular function
function generateParticles(particleColor) {
  for(let i=0;i<70;i++){

    const p=document.createElement("div");

    p.className="particle";

    let size=Math.random()*8+2;

    p.style.width=size+"px";
    p.style.height=size+"px";

    p.style.left=Math.random()*100+"vw";

    p.style.animationDuration=(8+Math.random()*12)+"s";

    p.style.animationDelay=Math.random()*8+"s";

    p.style.opacity=Math.random();

    p.style.background=
    Math.random()>0.5?
    particleColor : "#ffffff";

    document.body.appendChild(p);

  }
}

</script>

</body>
</html>
