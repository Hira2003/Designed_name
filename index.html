<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hadjer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Pacifico&family=Dancing+Script:wght@700&family=Lobster&family=Orbitron:wght@700&family=Cinzel:wght@700&family=Playfair+Display:wght@700&family=Satisfy&family=Great+Vibes&family=Audiowide&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;

/* Variables that will be updated by JS */
--theme-color: #d946ef;
--theme-color-secondary: #8b5cf6;

background:linear-gradient(-45deg,
#120524,
#2d0b59,
var(--theme-color-secondary),
#0f172a);

background-size:400% 400%;
animation:gradientMove 15s ease infinite;

font-family:Poppins,sans-serif;

}

@keyframes gradientMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

/* Background glow */

body::before{

content:"";
position:absolute;
width:700px;
height:700px;
background: var(--theme-color-secondary);
filter:blur(180px);
border-radius:50%;
opacity:.35;
animation:moveGlow 10s ease-in-out infinite alternate;

}

body::after{

content:"";
position:absolute;
width:500px;
height:500px;
background: var(--theme-color);
filter:blur(150px);
border-radius:50%;
opacity:.3;
animation:moveGlow2 12s ease-in-out infinite alternate;

}

@keyframes moveGlow{

from{
transform:translate(-250px,-120px);
}

to{
transform:translate(220px,160px);
}

}

@keyframes moveGlow2{

from{
transform:translate(250px,120px);
}

to{
transform:translate(-220px,-180px);
}

}

.container{

position:relative;
z-index:10;
text-align:center;

}

#name{

font-size:95px;
font-weight:bold;
color:white;
letter-spacing:5px;

text-shadow:

0 0 15px #fff,
0 0 30px var(--theme-color),
0 0 60px var(--theme-color-secondary),
0 0 90px #38bdf8;

animation:pulse 2s infinite;

}

@keyframes pulse{

50%{
transform:scale(1.06);
text-shadow:

0 0 20px white,
0 0 40px var(--theme-color),
0 0 80px cyan,
0 0 120px var(--theme-color-secondary);

}

}

.cursor{

display:inline-block;
width:5px;
height:90px;
background:white;
margin-left:5px;

animation:blink .7s infinite;

}

@keyframes blink{

50%{
opacity:0;
}

}

/* Particles */

.particle{

position:absolute;
border-radius:50%;
pointer-events:none;
animation:float linear infinite;

}

@keyframes float{

from{

transform:translateY(100vh) scale(.4);

}

to{

transform:translateY(-120vh) scale(1.2);

}

}

</style>
</head>
<body>

<div class="container">

<div id="name"></div>

</div>

<script>

// 1. Ask user for input on load
const userName = prompt("Please enter your name:", "Hadjer") || "Hadjer";
const userColor = prompt("What is your favorite color?", "#d946ef") || "#d946ef";

// Update Title and Typing Text
document.title = userName;
const text = userName;

// 2. Apply theme colors dynamically using CSS variables
document.body.style.setProperty('--theme-color', userColor);

// Create a slightly darker/different version of their color for the second gradient point
// (If they typed a word like "red", we fallback to a secondary color based on it)
document.body.style.setProperty('--theme-color-secondary', userColor + "aa"); 

const fonts=[

"'Poppins'",
"'Pacifico'",
"'Dancing Script'",
"'Lobster'",
"'Orbitron'",
"'Cinzel'",
"'Playfair Display'",
"'Satisfy'",
"'Great Vibes'",
"'Audiowide'"

];

const nameElement=document.getElementById("name");

let fontIndex=0;

function typeAnimation(){

nameElement.innerHTML="";

nameElement.style.fontFamily=fonts[fontIndex];

let i=0;

let typing=setInterval(()=>{

if(i<text.length){

nameElement.innerHTML=text.substring(0,i+1)+
"<span class='cursor'></span>";

i++;

}

else{

clearInterval(typing);

setTimeout(eraseAnimation,1800);

}

},180);

}

function eraseAnimation(){

let i=text.length;

let erase=setInterval(()=>{

if(i>=0){

nameElement.innerHTML=text.substring(0,i)+
"<span class='cursor'></span>";

i--;

}

else{

clearInterval(erase);

fontIndex++;

if(fontIndex>=fonts.length)
fontIndex=0;

setTimeout(typeAnimation,500);

}

},120);

}

typeAnimation();


// Floating particles

for(let i=0;i<70;i++){

const p=document.createElement("div");

p.className="particle";

let size=Math.random()*8+2;

p.style.width=size+"px";
p.style.height=size+"px";

p.style.left=Math.random()*100+"vw";

p.style.animationDuration=(8+Math.random()*12)+"s";

p.style.animationDelay=Math.random()*8+"s";

p.style.opacity=Math.random();

// Use user's theme color for particles
p.style.background=
Math.random()>0.5?
userColor : "#ffffff";

document.body.appendChild(p);

}

</script>

</body>
</html>
